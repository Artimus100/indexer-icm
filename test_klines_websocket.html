<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Klines Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .message { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-left: 3px solid #007bff; }
        .kline-data { background-color: #e7f3ff; padding: 10px; margin: 5px 0; border-left: 3px solid #0066cc; }
        button { padding: 10px 20px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Klines Test</h1>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div>
            <input type="text" id="poolId" placeholder="Pool ID" value="test-pool-123">
            <input type="text" id="interval" placeholder="Interval" value="1m">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>
        
        <div>
            <button onclick="subscribeKlines()">Subscribe to Klines</button>
            <button onclick="unsubscribeKlines()">Unsubscribe from Klines</button>
        </div>
        
        <div>
            <h3>Messages:</h3>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let poolId = '';
        let interval = '';

        function updateStatus(message, isConnected) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${isConnected ? 'connected' : 'disconnected'}`;
        }

        function addMessage(message, isKline = false) {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = isKline ? 'kline-data' : 'message';
            messageEl.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('Already connected');
                return;
            }

            ws = new WebSocket('ws://localhost:8081/ws');
            
            ws.onopen = function() {
                updateStatus('Connected to WebSocket', true);
                addMessage('Connected to WebSocket server');
            };

            ws.onclose = function(event) {
                updateStatus('Disconnected from WebSocket', false);
                addMessage(`WebSocket closed: ${event.code} - ${event.reason}`);
            };

            ws.onerror = function(error) {
                updateStatus('WebSocket error', false);
                addMessage(`WebSocket error: ${error}`);
            };

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);
                    addMessage(`Received: ${JSON.stringify(message, null, 2)}`, message.type === 'KLINE');
                } catch (e) {
                    addMessage(`Received (raw): ${event.data}`);
                }
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function subscribeKlines() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('Not connected to WebSocket');
                return;
            }

            poolId = document.getElementById('poolId').value;
            interval = document.getElementById('interval').value;
            
            const room = `klines@${poolId}@${interval}`;
            const message = {
                type: 'SUBSCRIBE',
                room: room,
                data: null
            };

            ws.send(JSON.stringify(message));
            addMessage(`Subscribed to klines room: ${room}`);
        }

        function unsubscribeKlines() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('Not connected to WebSocket');
                return;
            }

            const room = `klines@${poolId}@${interval}`;
            const message = {
                type: 'UNSUBSCRIBE',
                room: room
            };

            ws.send(JSON.stringify(message));
            addMessage(`Unsubscribed from klines room: ${room}`);
        }

        // Auto-connect on page load
        window.onload = function() {
            connect();
        };
    </script>
</body>
</html>
