[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.48", features = ["derive", "cargo", "wrap_help"] }
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
yellowstone-vixen = "0.5.0"
yellowstone-vixen-meteora-amm-parser = "0.5.0"
yellowstone-vixen-meteora-dbc-parser = "0.5.0"
yellowstone-vixen-parser = "0.5.0"
yellowstone-vixen-solana-rpc-source = "0.3.0"
yellowstone-vixen-yellowstone-grpc-source = "0.3.0"
serde = { version = "1.0.226", features = ["derive"] }
redis = { version = "0.32.5", features = ["aio", "tokio-comp", "tls-native-tls", "tokio-native-tls-comp"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.32", features = ["serde"] }

