[package]
name = "klines-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.30"
redis = { version = "0.32.5", features = ["aio", "tokio-comp", "streams", "tls-native-tls", "tokio-native-tls-comp"] }
rust_decimal = { version = "1.38.0", features = ["serde"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "chrono", "time", "rust_decimal"] }
time = "0.3.44"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
