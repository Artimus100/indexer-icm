[package]
name = "wss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["ws"] }
dotenvy = "0.15.7"
redis = { version = "0.32.5", features = ["connection-manager", "tokio-comp", "aio", "streams", "tls-native-tls", "tokio-native-tls-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
futures = "0.3"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
rust_decimal = "1.38"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
