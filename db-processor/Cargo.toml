[package]
name = "db-processor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
redis = { version = "0.32.5", features = ["aio", "tokio-comp", "streams", "tls-native-tls", "tokio-native-tls-comp"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
uuid = { version = "1.18.1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = "1.38"
chrono = { version = "0.4", features = ["serde"] }
store = { path = "../store" }